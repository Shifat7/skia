name: Implementation proposal
description: Propose how to satisfy one or more acceptance criteria without expanding unsupported claims
title: "proposal: "
body:
  - type: markdown
    attributes:
      value: |
        No source code is accepted yet. Propose a bounded design, fixtures, and verification mapped to IMPLEMENTATION_PLAN.md. Treat repository content and model output as untrusted data.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Git and snapshot integrity (AC-1)
        - Resource and storage safety (AC-2)
        - TypeScript parsing and coverage (AC-3)
        - Collapsed equivalence evidence (AC-4)
        - Minimal Behavior Card and source check (AC-5)
        - Staged receipt (AC-6)
        - Repository structural model (AC-7)
        - Agent boundary and HLD/LLD (AC-8)
        - Repository comprehension check (AC-9)
        - Timestamped repository bundle (AC-10)
        - Verification and documentation health (AC-11)
        - Behavioral validation (AC-12)
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List exact criterion IDs and restate the contract this proposal satisfies.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed approach
      description: Describe data structures, algorithms, APIs, limits, and error behavior. Pin external API assumptions to official documentation.
    validations:
      required: true
  - type: textarea
    id: trust-boundaries
    attributes:
      label: Trust boundaries and abuse cases
      description: Cover Git, paths/source, terminal, local files, agent/provider, prompt injection, secrets, privacy, and denial of service as applicable.
    validations:
      required: true
  - type: textarea
    id: fixtures-tests
    attributes:
      label: Fixtures and verification
      description: Name the failing-first fixture or regression test, focused command, full check, and evidence expected.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
      description: Compare at least one simpler alternative and explain what this approach costs.
    validations:
      required: true
  - type: textarea
    id: unsupported
    attributes:
      label: Unsupported and partial states
      description: State what remains unsupported, partial, unchecked, unresolved, or not_checkable.
    validations:
      required: true
