name: Staged collapsed-evidence fixture
description: Submit a small synthetic TypeScript change for entity mapping, collapsed evidence, Behavior Cards, source checks, or fallback behavior
title: "fixture(staged): "
body:
  - type: markdown
    attributes:
      value: |
        This project is documentation-only. Submit only synthetic or irreversibly minimized content that you have the right to publish. Do not include proprietary code, secrets, personal data, internal paths, or sensitive architecture.
  - type: checkboxes
    id: publication-safety
    attributes:
      label: Publication safety
      options:
        - label: I have the right to publish this fixture under the repository license.
          required: true
        - label: The fixture contains no secret, personal data, proprietary source, private path, or sensitive architecture.
          required: true
        - label: Any prompt-injection text is clearly labelled adversarial test data, not an instruction to contributors or agents.
          required: true
  - type: textarea
    id: base-source
    attributes:
      label: Base TypeScript or TSX source
      description: Paste the synthetic source before the change. Aim for 10 to 50 changed lines across the fixture.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: staged-source
    attributes:
      label: Staged TypeScript or TSX source
      description: Paste the synthetic source after the change.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: staged-diff
    attributes:
      label: Unified staged diff
      description: Paste the exact unified diff represented by the base and staged source.
      render: diff
    validations:
      required: true
  - type: dropdown
    id: entity-kind
    attributes:
      label: Expected entity kind
      options:
        - function
        - method
        - unsupported / no entity
    validations:
      required: true
  - type: textarea
    id: entity-ownership
    attributes:
      label: Expected entity ownership
      description: State kind, name, file, base/staged range, nested-entity rule, or the reason no entity is supported.
    validations:
      required: true
  - type: textarea
    id: collapsed-evidence
    attributes:
      label: Expected collapsed equivalence evidence
      description: List each compact relation, kind, base/staged anchors, and supported/partial/unmapped/unsupported coverage. State what must not be claimed.
    validations:
      required: true
  - type: textarea
    id: line-mapping
    attributes:
      label: Expected mapping and coverage
      description: State total, mapped, unmapped, unsupported, and excluded changed TypeScript lines with arithmetic.
    validations:
      required: true
  - type: textarea
    id: behavior-card
    attributes:
      label: Expected minimal Behavior Card
      description: Provide system-supplied GIVEN/WHEN, developer prediction kind, and whether BECAUSE or IMPACT is conditionally requested.
    validations:
      required: true
  - type: textarea
    id: source-check
    attributes:
      label: Expected source-check result
      description: State source_derived_match, source_derived_mismatch, or not_checkable, including branch/binding/endpoint reason.
    validations:
      required: true
  - type: textarea
    id: probe-spec
    attributes:
      label: Expected probe-spec result
      description: State draft_unexecuted or not_available plus invoke/expect or reason.
    validations:
      required: true
  - type: textarea
    id: budget
    attributes:
      label: Expected budget behavior
      description: State whether the fixture is within the 3-entity/150-line pilot budget or must be refused.
    validations:
      required: true
  - type: textarea
    id: failure-mode
    attributes:
      label: Misleading reduction to prevent
      description: What behavior could a bad collapsed view hide or overstate?
    validations:
      required: true
