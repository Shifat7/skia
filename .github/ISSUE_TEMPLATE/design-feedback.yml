name: Design feedback
description: Challenge the proposed reduced-reading, repository, artifact, privacy, or validation design
title: "design: "
body:
  - type: markdown
    attributes:
      value: |
        This is a documentation-only project. Focus on a specific contract, failure mode, or alternative. Do not include private source, secrets, personal data, or sensitive architecture.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Reduced-reading product thesis
        - Collapsed-equivalence grammar and source anchors
        - Minimal Behavior Card and scenario selection
        - Source-check truth boundary
        - Atomic staged Git snapshot
        - TypeScript-first repository inventory and coverage
        - Subsystem discovery and selection
        - Agent consent and prompt-injection boundary
        - HLD and LLD factual grounding and reading budget
        - Timestamped local bundle and manifest
        - Local privacy, retention, and deletion
        - Professional validation and kill criteria
        - Contribution, governance, or security process
        - Open decision
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or failure case
      description: State what can go wrong, for whom, and which current contract permits it.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Cite source text, a synthetic example, primary research, official documentation, or a reproducible command and output. State limitations.
    validations:
      required: true
  - type: textarea
    id: proposed-change
    attributes:
      label: Proposed change
      description: Describe the smallest change that closes the gap without hiding coverage or increasing reading unnecessarily.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-offs and rejected alternatives
      description: Explain what becomes worse, more complex, or less supported.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation or falsification
      description: What fixture, test, prototype, or experiment would show whether this proposal works?
    validations:
      required: true
